[profile.default]
ffi = false
libs = ["../../node_modules", "node_modules"]
optimizer = true
optimizer_runs = 1000000
out = "out"
solc = "0.8.28"
src = "src"
verbosity = 1
# the mint suites batch-create thousands of kami in one call; the 2^30 default OOGs
gas_limit = 100000000000
gas_reports = ["*"]
memory_limit = 43554432


[profile.build]
optimizer = false

[profile.build.fuzz]
runs = 128